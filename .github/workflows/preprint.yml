name: Check and publish preprint
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: miurchin-preprint-main
  cancel-in-progress: false
jobs:
  preprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the four marker panels and the combined FASTA
        run: |
          python -c "import sys; sys.path.insert(0,'publications'); from paper_tables import tables; from pathlib import Path; assert Path('publications/MiUrchin_preprint.md').read_text().endswith(tables())"
      - name: Determine whether research inputs changed
        id: version
        run: |
          tag=$(git tag --list 'preprint-v1.*' --sort=-version:refname | head -1)
          echo "previous=$tag" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet "$tag" HEAD -- analysis results markers figures sequences publications; then
            echo "next=1.$(( ${tag##*.} + 1 ))" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild and version research artifacts
        if: steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.next }}
          CHROME: /usr/bin/google-chrome
        run: |
          sudo apt-get update -qq && sudo apt-get install -y pandoc poppler-utils
          python scripts/stamp_preprint.py "$VERSION"
          python publications/build_preprint.py
          python publications/check_preprint.py
          python scripts/preprint_integrity.py
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m "Publish computational preprint v$VERSION"
          git tag -a "preprint-v$VERSION" -m "MiUrchin preprint v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/preprint-v$VERSION"
      - name: Complete tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.next && format('preprint-v{0}', steps.version.outputs.next) || steps.version.outputs.previous }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "MiUrchin computational preprint ${TAG#preprint-}" --notes "Fei Xia. Version ${TAG#preprint-v}. Computational preprint; not peer reviewed. The PDF, primer FASTA and SHA-256 checksums correspond to the tagged source."
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            dir=$(mktemp -d)
            for file in publications/MiUrchin_preprint.pdf publications/SHA256SUMS.txt sequences/all_markers.fasta; do
              git show "$TAG:$file" > "$dir/${file##*/}"
            done
            (cd "$dir" && sha256sum -c SHA256SUMS.txt)
            gh release upload "$TAG" "$dir"/* --clobber
            gh release edit "$TAG" --draft=false
          fi
